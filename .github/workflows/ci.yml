name: CI - Tests with video & artifacts

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Allure history
        uses: actions/download-artifact@v4
        with:
          name: allure-history
          path: tmp/allure-history
        continue-on-error: true

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install dependencies (Chrome, ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip xvfb ffmpeg
          # install latest Google Chrome
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] https://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -y
          sudo apt-get install -y google-chrome-stable

      - name: Start Xvfb and record video
        shell: bash
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          # start ffmpeg recording of X display; stops when job finishes
          ffmpeg -video_size 1920x1080 -f x11grab -i :99 -r 15 -codec:v libx264 -preset ultrafast -y automation/test-recording-${{ github.run_id }}-${{ github.job }}.mp4 &

      - name: Prepare Allure config & restore history
        run: |
          mkdir -p automation/allure-results
          # copy categories so Allure groups can be applied
          if [ -f automation/allure-config/categories.json ]; then
            cp automation/allure-config/categories.json automation/allure-results/categories.json
          fi
          # restore previous history if artifact downloaded
          if [ -d tmp/allure-history ]; then
            mkdir -p automation/allure-results/history
            cp -r tmp/allure-history/* automation/allure-results/history/ || true
          fi

      - name: Run tests (headless)
        working-directory: automation
        env:
          DISPLAY: :99
        run: |
          mvn -B -Dheadless=true test || true

      - name: Rerun failed @flaky scenarios (if any)
        working-directory: automation
        env:
          DISPLAY: :99
          RERUN: true
        run: |
          if [ -f target/rerun.txt ] && [ -s target/rerun.txt ]; then
            echo "Found rerun.txt, attempting selective rerun for @flaky scenarios"
            # Run selective rerun script which filters rerun.txt by @flaky tag
            chmod +x scripts/selective-rerun.sh || true
            ./scripts/selective-rerun.sh
          else
            echo "No rerun.txt or it's empty"
          fi

      - name: Stop ffmpeg recording (give ffmpeg time to flush)
        if: always()
        shell: bash
        run: |
          pkill -INT -f "ffmpeg.*test-recording-${{ github.run_id }}-${{ github.job }}.mp4" || true
          sleep 2 || true

      - name: Upload test video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-recording
          path: automation/test-recording-${{ github.run_id }}-${{ github.job }}.mp4

      - name: Generate Allure report (download CLI and generate)
        shell: bash
        run: |
          wget -q -O /tmp/allure.zip https://repo1.maven.org/maven2/io/qameta/allure/allure-commandline/2.22.1/allure-commandline-2.22.1.zip
          unzip -q /tmp/allure.zip -d /tmp
          export PATH=/tmp/allure-2.22.1/bin:$PATH
          # prepare executor information for traceability
          cat > automation/allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "buildName": "${GITHUB_JOB} #${GITHUB_RUN_NUMBER}",
            "buildUrl": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          /tmp/allure-2.22.1/bin/allure generate automation/allure-results -o automation/allure-report --clean || true

      - name: Upload Allure report & cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            automation/allure-report
            automation/target/cucumber-reports

      - name: Upload Allure history for next runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: automation/allure-report/history
